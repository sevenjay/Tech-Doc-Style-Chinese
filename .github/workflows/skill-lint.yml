name: Skill Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-copy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        env:
          GIT_SSL_NO_VERIFY: "true"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run copy lint
        run: |
          python -m unittest discover -s tests -v
          python skills/tech-doc-style-chinese-tw/scripts/lint_copy_rules.py .
